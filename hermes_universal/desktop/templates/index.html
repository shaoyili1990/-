<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Agent Desktop</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --bg: #0f0f13;
  --bg2: #1a1a24;
  --bg3: #252535;
  --fg: #e8e8f0;
  --fg2: #9090a8;
  --accent: #7c6ff0;
  --accent2: #5a4fd0;
  --green: #4ade80;
  --red: #f87171;
  --yellow: #fbbf24;
  --border: #2a2a3a;
  --radius: 10px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--fg);
  height: 100vh;
  overflow: hidden;
}

/* ===== Layout ===== */
.app { display: flex; height: 100vh; }

/* Sidebar */
.sidebar {
  width: 260px; background: var(--bg2); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
}
.sidebar-header {
  padding: 18px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.sidebar-header .logo {
  width: 32px; height: 32px; background: var(--accent);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-weight: bold; font-size: 16px;
}
.sidebar-header h1 { font-size: 16px; font-weight: 600; }
.sidebar-header .ver { font-size: 11px; color: var(--fg2); margin-left: auto; }

.sidebar-nav {
  padding: 12px; display: flex; flex-direction: column; gap: 4px; flex: 1;
}
.nav-item {
  padding: 10px 14px; border-radius: 8px; cursor: pointer;
  display: flex; align-items: center; gap: 10px; font-size: 14px;
  transition: all 0.15s; color: var(--fg2);
}
.nav-item:hover { background: var(--bg3); color: var(--fg); }
.nav-item.active { background: var(--accent); color: white; }
.nav-item .icon { width: 20px; text-align: center; }

.sidebar-footer {
  padding: 12px; border-top: 1px solid var(--border);
  font-size: 12px; color: var(--fg2); text-align: center;
}

/* Main content */
.main {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
}

/* Header */
.topbar {
  padding: 12px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px; background: var(--bg2);
}
.topbar h2 { font-size: 16px; font-weight: 500; }
.topbar .status-badge {
  padding: 4px 12px; border-radius: 20px; font-size: 12px;
  background: var(--bg3); color: var(--fg2);
}
.topbar .status-badge.online { background: rgba(74,222,128,0.15); color: var(--green); }

/* ===== Chat Area ===== */
.chat-area { flex: 1; display: flex; flex-direction: column; position: relative; }

.messages {
  flex: 1; overflow-y: auto; padding: 24px; display: flex;
  flex-direction: column; gap: 16px;
}
.msg {
  max-width: 80%; padding: 14px 18px; border-radius: 12px;
  line-height: 1.6; font-size: 14px;
}
.msg.user {
  align-self: flex-end; background: var(--accent); color: white;
  border-bottom-right-radius: 4px;
}
.msg.assistant {
  align-self: flex-start; background: var(--bg3); color: var(--fg);
  border-bottom-left-radius: 4px;
}
.msg.system {
  align-self: center; background: transparent; color: var(--fg2);
  font-size: 12px; padding: 8px 16px;
}
.msg .route-tag {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 11px; background: var(--accent2); margin-bottom: 6px;
}
.msg .review-result {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 11px; margin-top: 8px;
}
.msg .review-result.pass { background: rgba(74,222,128,0.2); color: var(--green); }
.msg .review-result.fail { background: rgba(248,113,113,0.2); color: var(--red); }

/* Input area */
.input-area {
  padding: 16px 24px; border-top: 1px solid var(--border);
  background: var(--bg2);
}
.input-row {
  display: flex; gap: 10px; align-items: flex-end;
}
.input-row textarea {
  flex: 1; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 16px; color: var(--fg);
  font-size: 14px; resize: none; min-height: 48px; max-height: 120px;
  font-family: inherit; outline: none;
}
.input-row textarea:focus { border-color: var(--accent); }
.input-row button {
  padding: 12px 24px; background: var(--accent); border: none;
  border-radius: 10px; color: white; font-size: 14px; cursor: pointer;
  font-weight: 500; transition: all 0.15s; white-space: nowrap;
}
.input-row button:hover { background: var(--accent2); }
.input-row button:disabled { opacity: 0.5; cursor: not-allowed; }

.upload-btn {
  padding: 10px; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 10px; cursor: pointer; color: var(--fg2);
  font-size: 18px; display: flex; align-items: center;
}
.upload-btn:hover { background: var(--bg); }

.image-preview {
  display: flex; gap: 8px; padding: 8px 0; flex-wrap: wrap;
}
.image-preview img {
  height: 60px; border-radius: 6px; border: 1px solid var(--border);
}

/* ===== Task Panel ===== */
.panel { display: none; flex: 1; overflow: hidden; }
.panel.active { display: flex; flex-direction: column; }

.task-list { padding: 16px 24px; overflow-y: auto; flex: 1; }
.task-card {
  padding: 14px 18px; background: var(--bg3); border-radius: var(--radius);
  margin-bottom: 10px; cursor: pointer; transition: all 0.15s;
  border: 1px solid transparent;
}
.task-card:hover { border-color: var(--accent); }
.task-card .task-name { font-weight: 500; margin-bottom: 4px; }
.task-card .task-meta { display: flex; gap: 12px; font-size: 12px; color: var(--fg2); }
.task-card .status-tag {
  padding: 2px 10px; border-radius: 10px; font-size: 11px;
}
.status-tag.daigousi { background: rgba(251,191,36,0.15); color: var(--yellow); }
.status-tag.zhixing { background: rgba(124,111,240,0.15); color: var(--accent); }
.status-tag.wancheng { background: rgba(74,222,128,0.15); color: var(--green); }
.status-tag.shibai { background: rgba(248,113,113,0.15); color: var(--red); }

/* ===== Config Panel ===== */
.config-panel { padding: 24px; overflow-y: auto; }
.config-section { margin-bottom: 24px; }
.config-section h3 {
  font-size: 14px; font-weight: 500; margin-bottom: 12px;
  color: var(--fg2); text-transform: uppercase; letter-spacing: 0.5px;
}
.config-row {
  display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
}
.config-row label { width: 120px; font-size: 13px; color: var(--fg2); flex-shrink: 0; }
.config-row input, .config-row select {
  flex: 1; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px; color: var(--fg); font-size: 13px;
  font-family: inherit; outline: none;
}
.config-row input:focus, .config-row select:focus { border-color: var(--accent); }
.config-save {
  padding: 10px 24px; background: var(--accent); border: none;
  border-radius: 8px; color: white; cursor: pointer; font-size: 14px;
  font-weight: 500;
}
.config-save:hover { background: var(--accent2); }

/* ===== System Panel ===== */
.system-panel { padding: 24px; overflow-y: auto; }
.stat-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px; margin-bottom: 24px;
}
.stat-card {
  padding: 16px; background: var(--bg3); border-radius: var(--radius);
  text-align: center;
}
.stat-card .num { font-size: 28px; font-weight: 700; color: var(--accent); }
.stat-card .label { font-size: 12px; color: var(--fg2); margin-top: 4px; }

/* ===== Loading ===== */
.typing {
  align-self: flex-start; background: var(--bg3); padding: 14px 20px;
  border-radius: 12px; border-bottom-left-radius: 4px;
}
.typing-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--fg2); margin: 0 2px; animation: pulse 1.2s infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo">H</div>
      <h1>Hermes Agent</h1>
      <span class="ver">v0.1</span>
    </div>
    <div class="sidebar-nav">
      <div class="nav-item active" onclick="switchPanel('chat')">
        <span class="icon">💬</span> 对话
      </div>
      <div class="nav-item" onclick="switchPanel('tasks')">
        <span class="icon">📋</span> 任务
      </div>
      <div class="nav-item" onclick="switchPanel('config')">
        <span class="icon">⚙️</span> 配置
      </div>
      <div class="nav-item" onclick="switchPanel('system')">
        <span class="icon">📊</span> 系统
      </div>
    </div>
    <div class="sidebar-footer">
      灵猴路由 · 骏马执行 · 司库状态 · 书童记忆
    </div>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="topbar">
      <h2 id="panelTitle">💬 对话</h2>
      <span class="status-badge online">● Online</span>
    </div>

    <!-- Chat Panel -->
    <div class="panel active" id="panel-chat">
      <div class="chat-area">
        <div class="messages" id="messages">
          <div class="msg system">
            Hermes Agent 已就绪。灵猴(Monkey) + 骏马(Horse) 双引擎驱动。
            支持多模态、多厂商、多任务类型。
          </div>
        </div>
        <div class="input-area">
          <div class="image-preview" id="imagePreview"></div>
          <div class="input-row">
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">📎</button>
            <input type="file" id="fileInput" accept="image/*" multiple hidden onchange="handleFiles(this)">
            <textarea id="userInput" rows="1" placeholder="输入消息，或上传图片..." onkeydown="handleKey(event)"></textarea>
            <button id="sendBtn" onclick="sendMessage()">发送</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tasks Panel -->
    <div class="panel" id="panel-tasks">
      <div class="task-list" id="taskList">
        <div style="text-align:center;color:var(--fg2);padding:40px;">加载中...</div>
      </div>
    </div>

    <!-- Config Panel -->
    <div class="panel" id="panel-config">
      <div class="config-panel">
        <div class="config-section">
          <h3>🐵 灵猴(Monkey) - 路由与审核</h3>
          <div class="config-row">
            <label>AI厂商</label>
            <select id="monkeyProvider">
              <option value="openai">OpenAI</option>
              <option value="anthropic">Anthropic Claude</option>
              <option value="deepseek">DeepSeek</option>
              <option value="ollama">Ollama (本地)</option>
              <option value="openrouter">OpenRouter</option>
            </select>
          </div>
          <div class="config-row">
            <label>模型</label>
            <input id="monkeyModel" value="gpt-4o" placeholder="模型名称">
          </div>
          <div class="config-row">
            <label>API Key</label>
            <input id="monkeyKey" type="password" placeholder="sk-..." value="">
          </div>
        </div>
        <div class="config-section">
          <h3>🐴 骏马(Horse) - 推理与执行</h3>
          <div class="config-row">
            <label>AI厂商</label>
            <select id="horseProvider">
              <option value="openai">OpenAI</option>
              <option value="anthropic">Anthropic Claude</option>
              <option value="deepseek" selected>DeepSeek</option>
              <option value="ollama">Ollama (本地)</option>
              <option value="openrouter">OpenRouter</option>
            </select>
          </div>
          <div class="config-row">
            <label>模型</label>
            <input id="horseModel" value="deepseek-chat" placeholder="模型名称">
          </div>
          <div class="config-row">
            <label>API Key</label>
            <input id="horseKey" type="password" placeholder="sk-..." value="">
          </div>
        </div>
        <button class="config-save" onclick="saveConfig()">保存配置</button>
      </div>
    </div>

    <!-- System Panel -->
    <div class="panel" id="panel-system">
      <div class="system-panel">
        <div class="stat-grid" id="statGrid">
          <div class="stat-card"><div class="num">-</div><div class="label">任务总数</div></div>
          <div class="stat-card"><div class="num">-</div><div class="label">子链总数</div></div>
          <div class="stat-card"><div class="num">-</div><div class="label">灵猴提供商</div></div>
          <div class="stat-card"><div class="num">-</div><div class="label">骏马提供商</div></div>
        </div>
        <div class="config-section">
          <h3>📜 宪法8条</h3>
          <div id="constitution" style="font-size:13px;color:var(--fg2);line-height:1.8;"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ===== State =====
let uploadedImages = [];
let isProcessing = false;

// ===== Panel switching =====
function switchPanel(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(`panel-${name}`).classList.add('active');
  document.querySelector(`.nav-item[onclick*="${name}"]`).classList.add('active');

  const titles = {chat:'💬 对话', tasks:'📋 任务', config:'⚙️ 配置', system:'📊 系统'};
  document.getElementById('panelTitle').textContent = titles[name] || name;

  if (name === 'tasks') loadTasks();
  if (name === 'system') loadSystem();
  if (name === 'config') loadConfig();
}

// ===== Chat =====
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function handleFiles(input) {
  for (const file of input.files) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const dataUrl = e.target.result;
      uploadedImages.push(dataUrl);
      const preview = document.getElementById('imagePreview');
      const img = document.createElement('img');
      img.src = dataUrl;
      preview.appendChild(img);
    };
    reader.readAsDataURL(file);
  }
  input.value = '';
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text && uploadedImages.length === 0) return;
  if (isProcessing) return;

  // Add user message
  addMessage(text, 'user');
  input.value = '';

  // Show typing
  const typingId = showTyping();

  // Send
  isProcessing = true;
  document.getElementById('sendBtn').disabled = true;

  try {
    const formData = new FormData();
    formData.append('message', text);
    if (uploadedImages.length > 0) {
      formData.append('images', JSON.stringify(
        uploadedImages.map(u => u.split(',')[1] || u)
      ));
    }

    const resp = await fetch('/api/chat', { method: 'POST', body: formData });
    const data = await resp.json();

    removeTyping(typingId);
    addAssistantMessage(data);

    uploadedImages = [];
    document.getElementById('imagePreview').innerHTML = '';
  } catch (e) {
    removeTyping(typingId);
    addMessage(`错误: ${e.message}`, 'system');
  } finally {
    isProcessing = false;
    document.getElementById('sendBtn').disabled = false;
  }
}

function addMessage(text, role) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function addAssistantMessage(data) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg assistant';

  let html = '';
  if (data.route) {
    html += `<span class="route-tag">${data.route.domain_name} (${Math.round(data.route.confidence*100)}%)</span><br>`;
  }
  html += data.response || '';

  if (data.review) {
    const cls = data.review.pass ? 'pass' : 'fail';
    const txt = data.review.pass ? '✓ 审核通过' : '✗ 审核不通过';
    html += `<br><span class="review-result ${cls}">${txt}</span>`;
  }

  div.innerHTML = html;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const id = 'typing-' + Date.now();
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = id;
  div.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return id;
}

function removeTyping(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

// ===== Tasks =====
async function loadTasks() {
  const container = document.getElementById('taskList');
  try {
    const resp = await fetch('/api/tasks?limit=20');
    const data = await resp.json();
    container.innerHTML = '';

    if (data.tasks.length === 0) {
      container.innerHTML = '<div style="text-align:center;color:var(--fg2);padding:40px;">暂无任务</div>';
      return;
    }

    data.tasks.forEach(task => {
      const card = document.createElement('div');
      card.className = 'task-card';
      const statusClass = task.status.includes('构思') ? 'daigousi'
        : task.status.includes('执行') ? 'zhixing'
        : task.status.includes('验证') || task.status.includes('通过') ? 'wancheng'
        : 'daigousi';
      card.innerHTML = `
        <div class="task-name">${task.name || task.task_id}</div>
        <div class="task-meta">
          <span>${task.task_id.substring(0, 16)}</span>
          <span>级别: ${task.level}</span>
          <span>迭代: v${task.iteration_count || 0}</span>
          <span class="status-tag ${statusClass}">${task.status}</span>
        </div>
      `;
      card.onclick = () => showTaskDetail(task.task_id);
      container.appendChild(card);
    });
  } catch (e) {
    container.innerHTML = `<div style="color:var(--red);padding:40px;">加载失败: ${e.message}</div>`;
  }
}

async function showTaskDetail(taskId) {
  try {
    const resp = await fetch(`/api/tasks/${taskId}`);
    const data = await resp.json();
    alert(JSON.stringify(data, null, 2));
  } catch(e) {
    alert('Error: ' + e.message);
  }
}

// ===== Config =====
async function loadConfig() {
  try {
    const resp = await fetch('/api/config');
    const data = await resp.json();
    if (data.monkey) {
      document.getElementById('monkeyProvider').value = data.monkey.provider || 'openai';
      document.getElementById('monkeyModel').value = data.monkey.model || '';
      document.getElementById('monkeyKey').value = data.monkey.api_key || '';
    }
    if (data.horse) {
      document.getElementById('horseProvider').value = data.horse.provider || 'deepseek';
      document.getElementById('horseModel').value = data.horse.model || '';
      document.getElementById('horseKey').value = data.horse.api_key || '';
    }
  } catch(e) {}
}

async function saveConfig() {
  const formData = new FormData();
  formData.append('monkey_provider', document.getElementById('monkeyProvider').value);
  formData.append('monkey_model', document.getElementById('monkeyModel').value);
  formData.append('monkey_key', document.getElementById('monkeyKey').value);
  formData.append('horse_provider', document.getElementById('horseProvider').value);
  formData.append('horse_model', document.getElementById('horseModel').value);
  formData.append('horse_key', document.getElementById('horseKey').value);

  try {
    const resp = await fetch('/api/config/update', { method: 'POST', body: formData });
    const data = await resp.json();
    addMessage(`配置已更新: ${data.updated.join(', ')}`, 'system');
  } catch(e) {
    addMessage(`配置保存失败: ${e.message}`, 'system');
  }
}

// ===== System =====
async function loadSystem() {
  try {
    const [statusResp, constitutionResp] = await Promise.all([
      fetch('/api/status'),
      fetch('/api/constitution'),
    ]);
    const status = await statusResp.json();
    const constitution = await constitutionResp.json();

    document.getElementById('statGrid').innerHTML = `
      <div class="stat-card"><div class="num">${status.tasks_total || 0}</div><div class="label">任务总数</div></div>
      <div class="stat-card"><div class="num">${status.chain_stats?.total || 0}</div><div class="label">子链总数</div></div>
      <div class="stat-card"><div class="num">${status.monkey_provider || '-'}</div><div class="label">灵猴提供商</div></div>
      <div class="stat-card"><div class="num">${status.horse_provider || '-'}</div><div class="label">骏马提供商</div></div>
    `;

    const conDiv = document.getElementById('constitution');
    if (constitution.constitution) {
      conDiv.innerHTML = constitution.constitution.map(c =>
        `<div style="padding:6px 0;border-bottom:1px solid var(--border);">${c.content}</div>`
      ).join('');
    }
  } catch(e) {}
}

// ===== Init =====
document.getElementById('userInput').focus();
</script>
</body>
</html>
