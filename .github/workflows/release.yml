# ==============================================================================
# Hermes Agent Universal - 全平台自动构建与发布
# 触发: 推送 v* 标签 或 手动触发
# 产出: Linux(二进制/DEB/AppImage) + macOS(DMG) + Windows(EXE) + Docker + PyPI
# ==============================================================================
name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: false

env:
  APP_NAME: hermes-agent
  PYTHON_VERSION: '3.12'

jobs:
  # ========== 1. 代码检查 ==========
  check:
    name: Code Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[all,dev]"
      - run: make check

  # ========== 2. 构建 pip 包（所有平台共用） ==========
  build-pip:
    name: Build pip Package
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: make pip-build
      - uses: actions/upload-artifact@v4
        with:
          name: pip-package
          path: dist/*.whl
          if-no-files-found: error

  # ========== 3. Linux 构建 ==========
  build-linux:
    name: Linux Build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y appimagetool dpkg-dev
          pip install pyinstaller
          pip install -e ".[all]"
      - name: Binary + DEB
        run: make build-linux-deb
      - name: Build AppImage
        run: make build-linux-appimage || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist/hermes-agent
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  # ========== 4. macOS 构建 ==========
  build-macos:
    name: macOS Build
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build deps
        run: |
          pip install pyinstaller
          pip install -e ".[all]"
      - name: Build .app + DMG
        run: |
          pyinstaller --clean hermes-agent.spec
          echo "✅ .app ready"
          # 生成 DMG
          hdiutil create -srcfolder dist/hermes-agent.app \
            -volname "Hermes Agent ${{ github.ref_name }}" \
            dist/hermes-agent-${{ github.ref_name }}-macos-x86_64.dmg
          echo "✅ DMG ready"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/hermes-agent.app/
            dist/*.dmg
          if-no-files-found: error

  # ========== 5. Windows 构建 ==========
  build-windows:
    name: Windows Build
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build deps
        shell: pwsh
        run: |
          pip install pyinstaller
          pip install -e ".[all]"
      - name: Build exe
        shell: pwsh
        run: pyinstaller --clean hermes-agent.spec
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/hermes-agent.exe
          if-no-files-found: error

  # ========== 6. Docker 构建 ==========
  build-docker:
    name: Docker Image
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub (optional)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/hermes-agent:latest
            ${{ secrets.DOCKER_USERNAME }}/hermes-agent:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========== 7. 发布到 PyPI ==========
  publish-pypi:
    name: Publish to PyPI
    needs: [build-pip]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pip-package
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
        continue-on-error: true

  # ========== 8. 创建 GitHub Release ==========
  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Organize release assets
        run: |
          mkdir -p release
          find release-artifacts -type f \( \
            -name "hermes-agent" -o \
            -name "*.deb" -o \
            -name "*.AppImage" -o \
            -name "*.dmg" -o \
            -name "*.exe" -o \
            -name "*.whl" \
          \) -exec cp -v {} release/ \;
          ls -lh release/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: .github/RELEASE_TEMPLATE.md
          fail_on_unmatched_files: false
          files: release/*
          generate_release_notes: true
