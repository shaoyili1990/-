name: Build & Release

on:
  push:
    tags:
      - 'v*'          # 打 tag 自动构建发布
  workflow_dispatch:   # 手动触发
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: false

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: |
          pip install build hatchling
          pip install -e ".[all]"
      - name: 完整性检查
        run: make check

  build-linux:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          pip install pyinstaller build hatchling
          pip install -e ".[all]"
      - name: 构建 Linux 独立可执行文件
        run: |
          pyinstaller --clean hermes-agent.spec
          echo "✅ Binary: dist/hermes-agent"
      - name: 构建 DEB 包
        run: |
          make build-linux-deb
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist/hermes-agent
            dist/*.deb
          if-no-files-found: warn

  build-macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装构建依赖
        run: |
          brew install create-dmg 2>/dev/null || true
          pip install pyinstaller build hatchling
          pip install -e ".[all]"
      - name: 构建 macOS .app
        run: |
          pyinstaller --clean hermes-agent.spec
          echo "✅ macOS .app: dist/hermes-agent.app"
      - name: 创建 DMG (create-dmg)
        run: |
          if which create-dmg &>/dev/null; then
            create-dmg \
              --volname "Hermes Agent" \
              --window-pos 200 120 \
              --window-size 600 400 \
              --icon-size 100 \
              --app-drop-link 400 200 \
              dist/hermes-agent-$(python3 -c "import hermes_universal; print(hermes_universal.__version__)")-macos-x86_64.dmg \
              dist/hermes-agent.app/ 2>/dev/null || true
          fi
          echo "✅ DMG available at dist/*.dmg"
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/hermes-agent.app/
            dist/*.dmg
          if-no-files-found: warn

  build-windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装构建依赖
        shell: pwsh
        run: |
          pip install pyinstaller build hatchling
          pip install -e ".[all]"
      - name: 构建 Windows exe
        shell: pwsh
        run: |
          pyinstaller --clean hermes-agent.spec
          echo "✅ Windows exe: dist/hermes-agent.exe"
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/hermes-agent.exe
          if-no-files-found: warn

  build-docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 登录 DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: 提取版本号
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/hermes-agent:latest
            ${{ secrets.DOCKER_USERNAME }}/hermes-agent:${{ steps.version.outputs.version }}

  create-release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: 整理发布资产
        run: |
          mkdir -p release
          find release-assets -type f \( -name "hermes-agent" -o -name "*.deb" -o -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" \) -exec cp {} release/ \;
          ls -lh release/
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## Hermes Agent Universal ${{ github.ref_name }}

            ### 下载
            | 平台 | 文件 |
            |------|------|
            | Linux (通用) | `hermes-agent` 独立可执行文件 |
            | Debian/Ubuntu | `*.deb` 安装包 |
            | macOS | `*.dmg` 磁盘映像 |
            | Windows | `hermes-agent.exe` 可执行文件 |

            ### 快速开始
            ```bash
            # Linux
            ./hermes-agent

            # macOS
            open hermes-agent-*.dmg

            # Windows
            hermes-agent.exe
            ```

            ### Docker
            ```bash
            docker pull ${{ secrets.DOCKER_USERNAME }}/hermes-agent:${{ github.ref_name }}
            docker run -e OPENAI_API_KEY=$OPENAI_API_KEY -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/hermes-agent:${{ github.ref_name }}
            ```
          files: release/*
          generate_release_notes: true
