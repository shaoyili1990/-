[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-agent-universal"
version = "0.1.0"
description = "Hermes Agent Universal - 通用可移植AI Agent系统"
authors = [{name = "Hermes Agent Team"}]
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"

dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "jinja2>=3.0",
    "python-multipart>=0.0.5",
    "pillow>=10.0",
]

[project.optional-dependencies]
all = [
    "openai>=1.0",
    "anthropic>=0.30",
    "google-generativeai>=0.3",
    "ollama>=0.1",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
]

[project.scripts]
hermes = "hermes_universal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hermes_universal"]

[tool.hatch.build.targets.sdist]
include = [
    "hermes_universal/**",
    "installer/**",
    "fingerprints/**",
    "subchains/**",
    "validations/**",
    "config.yaml",
    "SKILL.md",
    "pyproject.toml",
]

[project.urls]
Homepage = "https://github.com/hermes-agent/universal"
Repository = "https://github.com/hermes-agent/universal"

[tool.hatch.build.targets.wheel]
packages = ["hermes_universal"]

[tool.hatch.build.targets.sdist]
include = [
    "hermes_universal/**",
    "agent-kit/**",
    "installer/**",
    "fingerprints/**",
    "subchains/**",
    "validations/**",
    "config.yaml",
    "SKILL.md",
    "pyproject.toml",
]
