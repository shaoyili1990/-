<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <rect width="256" height="256" rx="48" fill="#1a1a2e"/>
  <!-- Horse head silhouette -->
  <g transform="translate(128,128)">
    <!-- Horse head -->
    <path d="M-30,-50 C-10,-70 20,-75 35,-60 C45,-50 50,-30 45,-10 
             C40,10 30,25 20,35 C10,45 -5,50 -20,45 
             C-35,40 -45,30 -50,15 C-55,0 -50,-20 -40,-35 Z" 
          fill="#e94560" stroke="#e94560" stroke-width="2"/>
    <!-- Horse eye -->
    <circle cx="15" cy="-25" r="4" fill="#1a1a2e"/>
    <!-- Horse mane -->
    <path d="M35,-60 C25,-65 15,-60 10,-55 C15,-50 20,-45 25,-40 
             C30,-45 35,-50 35,-60Z" fill="#0f3460"/>
    <!-- Horse ear -->
    <path d="M5,-65 L10,-80 L20,-65 Z" fill="#e94560"/>
    <!-- Monkey face -->
    <circle cx="-20" cy="15" r="3" fill="#1a1a2e"/>
    <circle cx="-10" cy="10" r="3" fill="#1a1a2e"/>
    <ellipse cx="-15" cy="20" rx="4" ry="3" fill="#1a1a2e"/>
    <!-- Chain links -->
    <path d="M-40,-20 Q-55,-15 -55,0 Q-55,15 -40,20" 
          fill="none" stroke="#0f3460" stroke-width="3"/>
    <path d="M-35,-15 Q-45,-10 -45,0 Q-45,10 -35,15" 
          fill="none" stroke="#16213e" stroke-width="2"/>
  </g>
</svg>
